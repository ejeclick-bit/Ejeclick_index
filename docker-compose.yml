services:
  frontend:
    build:
      context: ./apps/landing-ejeclick
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./apps/landing-ejeclick/backend
      dockerfile: Dockerfile
    ports:
      - "3001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ejeclick:ejeclick@db:5432/ejeclick
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "3002:5432"
    environment:
      - POSTGRES_USER=ejeclick
      - POSTGRES_PASSWORD=ejeclick
      - POSTGRES_DB=ejeclick
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejeclick"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
