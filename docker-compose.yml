services:
  frontend:
    build:
      context: .
      dockerfile: apps/landing-ejeclick/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./apps/landing-ejeclick/backend
      dockerfile: Dockerfile
    ports:
      - "3001:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ejeclick:ejeclick@db:5432/ejeclick
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ejeclick
      - POSTGRES_PASSWORD=ejeclick
      - POSTGRES_DB=ejeclick
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejeclick"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  admin-backend:
    build:
      context: ./apps/flow-flow/admin
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - FLOW_DATABASE_URL=postgresql://flow_api:flow_api@db-flow:5432/flow_flow
    volumes:
      - uploads_flow:/app/uploads
    depends_on:
      db-flow:
        condition: service_healthy

  db-flow:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=flow_flow
      - POSTGRES_PASSWORD=flow_flow
      - POSTGRES_DB=flow_flow
    volumes:
      - pgdata_flow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_flow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata_flow:
  uploads_flow:
